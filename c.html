<title>Shemos Word Study</title>
<style>
:root{
  --paper:#F1EFEA; --card:#FBFAF7; --ink:#1E2430; --ink-soft:#5A6274; --ink-faint:#8B92A1;
  --line:#DFDBD2; --line-soft:#EAE7E0;
  --accent:#2A5580; --accent-soft:#E3EAF2; --accent-ink:#FFFFFF;
  --gold:#9C7B2E; --gold-soft:#F3EAD6;
  --good:#2F6B4F; --good-soft:#E0EDE6; --miss:#9A3D3D; --miss-soft:#F3E3E3;
  --he:"Frank Ruehl CLM","Taamey Frank CLM","Narkisim","Times New Roman",serif;
  --en:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#151821; --card:#1D2129; --ink:#E8E6E1; --ink-soft:#A2A8B5; --ink-faint:#767D8C;
  --line:#2E3440; --line-soft:#252A34;
  --accent:#7EA8D0; --accent-soft:#22303E; --accent-ink:#111620;
  --gold:#C9A44E; --gold-soft:#2E2819;
  --good:#7FBF9A; --good-soft:#1B2A22; --miss:#D08B8B; --miss-soft:#2C1E1E;}}
:root[data-theme="dark"]{
  --paper:#151821; --card:#1D2129; --ink:#E8E6E1; --ink-soft:#A2A8B5; --ink-faint:#767D8C;
  --line:#2E3440; --line-soft:#252A34;
  --accent:#7EA8D0; --accent-soft:#22303E; --accent-ink:#111620;
  --gold:#C9A44E; --gold-soft:#2E2819;
  --good:#7FBF9A; --good-soft:#1B2A22; --miss:#D08B8B; --miss-soft:#2C1E1E;}
:root[data-theme="light"]{
  --paper:#F1EFEA; --card:#FBFAF7; --ink:#1E2430; --ink-soft:#5A6274; --ink-faint:#8B92A1;
  --line:#DFDBD2; --line-soft:#EAE7E0;
  --accent:#2A5580; --accent-soft:#E3EAF2; --accent-ink:#FFFFFF;
  --gold:#9C7B2E; --gold-soft:#F3EAD6;
  --good:#2F6B4F; --good-soft:#E0EDE6; --miss:#9A3D3D; --miss-soft:#F3E3E3;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--en);
  -webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:36rem;margin:0 auto;padding:0 1.1rem 6.5rem}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:1.4rem 0 1rem;border-bottom:1px solid var(--line)}
.top h1{font-size:1.04rem;margin:0;font-weight:600}
.top .sub{font-family:var(--ui);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.2rem}
.who{font-family:var(--ui);font-size:.78rem;color:var(--accent);background:none;border:0;
  cursor:pointer;flex:none;padding:.3rem 0}
.who:hover{text-decoration:underline}

button{font-family:var(--ui);cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
.face{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:1.1rem}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;
  padding:.72rem 1rem;font-size:.92rem;font-weight:500;width:100%}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-ghost{border:0;background:none;color:var(--ink-soft);font-size:.83rem;padding:.55rem}
.btn-ghost:hover{color:var(--accent)}
.row{display:flex;gap:.6rem}.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:.85rem}
.eyebrow{font-family:var(--ui);font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint)}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate}

/* ---- reader ---- */
.pickrow{display:flex;gap:.45rem;overflow-x:auto;padding:.85rem 0 .55rem;scrollbar-width:none}
.pickrow::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--ui);font-size:.76rem;padding:.38rem .75rem;border-radius:99px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.aliyot{display:flex;gap:.4rem;padding:0 0 .8rem}
.aliyot button{flex:1;font-family:var(--ui);font-size:.8rem;padding:.42rem 0;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  font-variant-numeric:tabular-nums}
.aliyot button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink)}
.text{font-family:var(--he);direction:rtl;text-align:right;font-size:1.62rem;line-height:2.35;
  padding:.3rem 0 1rem}
.pas{margin-bottom:.7rem}
.vn{font-family:var(--ui);font-size:.64rem;color:var(--ink-faint);vertical-align:.55em;
  margin-inline-end:.4rem;direction:ltr;unicode-bidi:embed;font-variant-numeric:tabular-nums}
/* cursor:pointer is load-bearing on iOS: Safari does not deliver click events from plain
   spans to a delegated listener without it. padding widens the tap target on short words. */
.tw{cursor:pointer;border-radius:5px;padding:.3em .16em;margin:0 -.04em;
  transition:background .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.tw:hover{background:var(--accent-soft)}}
.tw:active{background:var(--accent-soft)}
.tw.picked{background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold)}
.tw.act{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.readhint{font-family:var(--ui);font-size:.75rem;color:var(--ink-faint);line-height:1.6;
  padding:.2rem 0 .1rem;text-wrap:balance}

/* ---- word sheet ---- */
.sheet{position:fixed;inset:0;background:rgba(12,15,22,.45);display:flex;align-items:flex-end;
  justify-content:center;z-index:40;padding:.9rem}
@media(min-width:34rem){.sheet{align-items:center}}
.sheet .inner{background:var(--card);border-radius:var(--r);padding:1.25rem;width:100%;
  max-width:32rem;display:flex;flex-direction:column;gap:.8rem}
.sheet h2{margin:0;font-size:1.1rem;font-weight:600}
.sheet p{margin:0;font-size:.88rem;color:var(--ink-soft);line-height:1.55}
.wform{font-family:var(--he);direction:rtl;font-size:2.4rem;text-align:center;line-height:1.5}
.wlemma{font-family:var(--he);direction:rtl;font-size:1.3rem;text-align:center;color:var(--ink-soft)}
.wgloss{font-size:1.15rem;text-align:center;text-wrap:balance}
.wmeta{font-family:var(--ui);font-size:.7rem;color:var(--ink-faint);text-align:center;
  letter-spacing:.03em}
input[type=text]{font-family:var(--en);font-size:1rem;padding:.7rem .85rem;border-radius:11px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.namebtn{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;
  padding:.82rem 1rem;font-size:.98rem;width:100%;text-align:left;font-family:var(--en)}
.namebtn small{font-family:var(--ui);font-size:.72rem;color:var(--ink-faint)}

/* ---- my words ---- */
.wlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.wrow{display:grid;grid-template-columns:1.7rem 1fr auto;gap:.7rem;align-items:baseline;
  padding:.68rem .8rem;border-bottom:1px solid var(--line-soft)}
.wrow:last-child{border-bottom:0}
.wrow .num{font-family:var(--ui);font-size:.7rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.wrow .h{font-family:var(--he);direction:rtl;font-size:1.35rem}
.wrow .g{display:block;font-size:.85rem;color:var(--ink-soft);line-height:1.4;margin-top:.1rem}
.wrow .x{font-family:var(--ui);font-size:.72rem;color:var(--ink-faint);background:none;border:0;
  padding:.3rem .2rem}
.wrow .x:hover{color:var(--miss)}
.wrow.rested{background:var(--gold-soft)}
.empty{text-align:center;padding:2.4rem 1.2rem;color:var(--ink-soft);font-size:.92rem;
  line-height:1.6;text-wrap:balance}

/* ---- practice ---- */
.session-meta{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--ui);font-size:.73rem;color:var(--ink-faint);padding:.85rem 0 .5rem}
.session-meta b{color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
.face{min-height:14.5rem;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.6rem;text-align:center;padding:1.8rem 1.1rem;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.face .p-he{font-family:var(--he);font-size:2.8rem;line-height:1.55;direction:rtl}
.face .p-en{font-size:1.62rem;line-height:1.35;text-wrap:balance}
.face .tap{font-family:var(--ui);font-size:.73rem;color:var(--ink-faint);margin-top:.45rem}
.answer{border-top:1px solid var(--line-soft);padding:1.1rem 1.1rem 1.25rem;text-align:center;
  display:flex;flex-direction:column;gap:.5rem}
.answer .a-he{font-family:var(--he);font-size:1.95rem;direction:rtl;line-height:1.6}
.answer .a-en{font-size:1.25rem;text-wrap:balance}
.answer .a-form{font-family:var(--he);font-size:1.1rem;direction:rtl;color:var(--ink-soft)}
.answer .a-ref{font-family:var(--ui);font-size:.7rem;color:var(--ink-faint)}
.grade{display:flex;gap:.6rem;margin-top:.3rem}
.grade button{flex:1;border-radius:11px;padding:.82rem;font-size:.9rem;font-weight:600;
  border:1px solid transparent}
.g-miss{background:var(--miss-soft);color:var(--miss)}
.g-good{background:var(--good-soft);color:var(--good)}
.spot{display:inline-block;font-family:var(--ui);font-size:.63rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:.2rem .5rem;
  border-radius:99px}
.big{display:flex;align-items:baseline;gap:.5rem;margin:.1rem 0 .3rem}
.big .n{font-size:2.4rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big .of{color:var(--ink-faint);font-family:var(--ui);font-size:.85rem}
.seg{display:flex;background:var(--line-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink-soft);font-size:.8rem;
  padding:.5rem .3rem;border-radius:8px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.09)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;
  border-bottom:1px solid var(--line-soft);font-size:.88rem}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-soft)}.kv b{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:.65rem}
.stepper button{width:2rem;height:2rem;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:1.05rem;line-height:1;flex:none}
.stepper b{min-width:4rem;text-align:center;font-variant-numeric:tabular-nums}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs[hidden]{display:none}
.tabs button{flex:1;border:0;background:none;color:var(--ink-faint);font-size:.7rem;
  padding:.6rem .3rem .66rem;display:flex;flex-direction:column;align-items:center;gap:.22rem}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;transform:translate(1.35rem,-.35rem);background:var(--accent);
  color:var(--accent-ink);font-size:.6rem;border-radius:99px;padding:.05rem .3rem;
  font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .17s ease-out}@keyframes f{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Shemos Word Study</h1><div class="sub" id="topsub">Tap what you don't know</div></div>
    <button class="who" id="whoBtn" hidden></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="read" aria-current="page">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/></svg>
    Read</button>
  <button data-tab="words">
    <svg class="ic" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
    My words</button>
  <button data-tab="practice">
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h11a4 4 0 0 1 0 8H7"/><path d="M9 11l-2 3 2 3"/></svg>
    Practice</button>
</nav>
<div id="sheet"></div>

<script>
const SEFARIM = [{"code": "gen", "name": "Bereishis"}, {"code": "exod", "name": "Shemos"}, {"code": "lev", "name": "Vayikra"}, {"code": "num", "name": "Bamidbar"}, {"code": "deut", "name": "Devarim"}];             /* [{code, name}, ...] */
let LEX = [];                            /* the whole Torah's lexicon, loaded once */
let V = [], PAR = [];                    /* the sefer currently open */
let SEFER = SEFARIM[1].code;             /* default: Shemos */
const BOOKCACHE = {};

async function loadLex(){
  if(LEX.length) return;
  LEX = await (await fetch('data/lex.json')).json();
  LEX.forEach(L => { LEXBY[L[3]] = L; });
}
async function useSefer(code){
  if(!BOOKCACHE[code]) BOOKCACHE[code] = await (await fetch('data/' + code + '.json')).json();
  const b = BOOKCACHE[code];
  V = b.verses; PAR = b.aliyot; SEFER = code;
  pIdx = 0; aIdx = 0;
}
function seferName(code){
  const s = SEFARIM.find(x => x.code === code);
  return s ? s.name : code;
}
/* This build belongs to one person. Each sister gets her own link and her own storage key,
   so the two lists cannot reach each other even on a shared phone. */
const OWNER = '__OWNER__';
const LS = 'shemos-word-study-c-v1';

let db = load(), me = OWNER, tab = 'read', S = null;
let pIdx = 0, aIdx = 0, active = null;

function blank(n){ return {name:n, deck:[], back:0, stats:{}, targetMin:5, sessions:[],
  seenIntro:false, lastSefer:'exod'}; }
function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(!d || !d.learners) d = {learners:{}, last:OWNER};
  if(!d.learners[OWNER]) d.learners[OWNER] = blank(OWNER);
  d.last = OWNER;
  return d;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(db)); }catch(e){} }

/* ---------------- backup code ----------------
   Safari clears a site's storage after about a week untouched, so everything both girls have
   collected can be lifted out as one pasteable code and put back on any device. */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function toB64(bytes){
  let out = '';
  for(let i = 0; i < bytes.length; i += 3){
    const a = bytes[i], b = bytes[i+1], c = bytes[i+2];
    out += B64[a >> 2] + B64[((a & 3) << 4) | ((b || 0) >> 4)]
        + (b === undefined ? '=' : B64[((b & 15) << 2) | ((c || 0) >> 6)])
        + (c === undefined ? '=' : B64[c & 63]);
  }
  return out;
}
function fromB64(str){
  const s = str.replace(/[^A-Za-z0-9+/]/g, ''), out = [];
  for(let i = 0; i < s.length; i += 4){
    const n = (B64.indexOf(s[i]) << 18) | (B64.indexOf(s[i+1]) << 12)
            | (Math.max(0, B64.indexOf(s[i+2])) << 6) | Math.max(0, B64.indexOf(s[i+3]));
    out.push((n >> 16) & 255);
    if(s[i+2] !== undefined) out.push((n >> 8) & 255);
    if(s[i+3] !== undefined) out.push(n & 255);
  }
  return new Uint8Array(out);
}
function makeCode(){
  const slim = {};
  for(const [n, s] of Object.entries(db.learners)){
    slim[n] = {b:s.back, t:s.targetMin, st:s.stats, ss:s.sessions.length,
               d:s.deck.map(w => [w.s, w.f, w.r, w.x || '', w.k || 'exod'])};
  }
  const json = JSON.stringify({v:1, l:slim});
  return 'SHEMOS1-' + toB64(new TextEncoder().encode(json));
}
function applyCode(code){
  const body = String(code).trim().replace(/^SHEMOS1-/, '');
  if(!body) throw new Error('empty');
  const json = new TextDecoder().decode(fromB64(body));
  const obj = JSON.parse(json);
  if(!obj || obj.v !== 1 || !obj.l) throw new Error('shape');
  const learners = {};
  for(const [n, s] of Object.entries(obj.l)){
    learners[n] = {name:n, back:s.b|0, targetMin:s.t||5, stats:s.st||{},
      sessions:Array.from({length:s.ss|0}, () => ({t:0,total:0,right:0,ms:0})),
      deck:(s.d||[]).map(a => ({s:a[0], f:a[1], r:a[2], x:a[3] || '', k:a[4] || 'exod'}))};
  }
  if(!Object.keys(learners).length) throw new Error('no learners');
  return learners;
}
function L(){ return db.learners[me]; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmp = (a,b) => a[0]-b[0] || a[1]-b[1];
function fmtTime(ms){ const t=Math.round(ms/1000);
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }

/* verses of the currently selected aliyah */
function currentVerses(){
  const a = PAR[pIdx].aliyot[aIdx];
  return V.filter(v => cmp([v.c,v.v],[a[0],a[1]]) >= 0 && cmp([v.c,v.v],[a[2],a[3]]) <= 0);
}
function deckHas(sid){ return L().deck.some(w => w.s === sid); }
function deckIdx(sid){ return L().deck.findIndex(w => w.s === sid); }

/* A saved word keeps only what is personal to it -- the form she tapped and where. The
   dictionary form and definition are re-read from the lexicon every time, so corrections
   to a gloss reach words that were already collected. */
const LEXBY = {};
function wd(w){
  const L2 = LEXBY[w.s];
  return L2 ? {s:w.s, f:w.f, r:w.r, x:w.x, k:w.k, h:L2[0], g:L2[1], p:L2[2]} : w;
}

/* ---------------- shell ---------------- */
function render(){
  const v = document.getElementById('view');
  document.getElementById('tabs').hidden = false;
  const w = document.getElementById('whoBtn'); w.hidden = false; w.innerHTML = 'Your words';
  const n = L().deck.length;
  // innerHTML, not textContent: the file is escaped to pure ASCII, and textContent would
  // print the character references literally instead of resolving them.
  document.getElementById('topsub').innerHTML =
    n ? n + ' word' + (n===1?'':'s') + ' collected' : 'Tap what you don&#x2019;t know';
  [...document.querySelectorAll('.tabs button')].forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab===tab ? 'page' : 'false'));
  v.className = 'fade';
  v.innerHTML = tab==='read' ? viewRead() : tab==='words' ? viewWords() : viewPractice();
  if(tab==='read') wireRead();
  if(tab==='words') wireWords();
  if(tab==='practice') wirePractice();
}
document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  tab = b.dataset.tab; S = null; active = null; render();
};
document.getElementById('whoBtn').onclick = () => ownerSheet();

/* ---------------- this is your copy ---------------- */
function ownerSheet(){
  const n = L().deck.length;
  sheet(`<h2>Your words</h2>
    <p>This link is yours. You have <b>${n}</b> word${n===1?'':'s'} collected, and they are
       saved on this device only &mdash; nobody else opens this copy.</p>
    <button class="btn" id="backupBtn">Back up or restore</button>
    <button class="btn-ghost" id="resetBtn">Start over</button>
    <button class="btn-ghost" id="closeS">Close</button>`, () => {
    document.getElementById('backupBtn').onclick = () => backupSheet();
    document.getElementById('closeS').onclick = () => { closeSheet(); render(); };
    document.getElementById('resetBtn').onclick = () => sheet(
      `<h2>Start over?</h2>
       <p>This clears all ${n} of your words and your place in them. It cannot be undone
          unless you have a backup code.</p>
       <button class="btn" id="yes" style="background:var(--miss-soft);color:var(--miss);
         border-color:transparent">Clear my words</button>
       <button class="btn-ghost" id="no">Keep them</button>`, () => {
      document.getElementById('yes').onclick = () => {
        db.learners[OWNER] = blank(OWNER); save(); closeSheet(); S=null; tab='read'; render(); };
      document.getElementById('no').onclick = () => { closeSheet(); render(); };
    });
  });
}

/* ---------------- first run ---------------- */
function introSheet(){
  sheet(`<h2>How this works</h2>
    <p><b>1. Read.</b> The parsha is here, aliyah by aliyah. Tap any word you don&#x2019;t know and
       it will tell you what it means.</p>
    <p><b>2. Collect.</b> If it&#x2019;s new to you, add it. Your words gather in
       <b>My&nbsp;words</b> &#x2014; nobody chose them for you, they&#x2019;re the ones you got stuck on.</p>
    <p><b>3. Practice.</b> Go through your list from the beginning each day, and add a word
       or two as you read. Once the review runs past five minutes, the oldest ones retire
       and only come back for a spot-check.</p>
    <button class="btn btn-primary" id="goRead">Start reading</button>`, () => {
    document.getElementById('goRead').onclick = () => {
      L().seenIntro = true; save(); closeSheet(); render();
    };
  });
}

/* ---------------- backup sheet ---------------- */
function backupSheet(){
  const mine = L().deck.length;
  sheet(`<h2>Back up or restore</h2>
    <p>This code holds all ${mine} of your words and where you are up to. Copy it somewhere
       safe &mdash; a note, or send it to yourself. If Safari ever clears the app, or you move
       to a new phone, paste it back to get everything returned.</p>
    <textarea id="codeBox" rows="4" readonly
      style="font-family:ui-monospace,Menlo,monospace;font-size:.72rem;width:100%;
             padding:.7rem;border-radius:11px;border:1px solid var(--line);
             background:var(--paper);color:var(--ink);resize:vertical;
             word-break:break-all"></textarea>
    <button class="btn btn-primary" id="copyBtn">Copy the code</button>
    <button class="btn" id="restoreBtn">Restore from a code</button>
    <button class="btn-ghost" id="closeS">Close</button>`, () => {
    const box = document.getElementById('codeBox');
    box.value = makeCode();
    document.getElementById('closeS').onclick = () => { closeSheet(); render(); };
    document.getElementById('copyBtn').onclick = async () => {
      const btn = document.getElementById('copyBtn');
      try{
        await navigator.clipboard.writeText(box.value);
        btn.textContent = 'Copied';
      }catch(e){
        // clipboard access is often blocked in an embedded frame; select it instead
        box.removeAttribute('readonly'); box.focus(); box.setSelectionRange(0, box.value.length);
        btn.textContent = 'Selected &#x2014; press Copy';
      }
    };
    document.getElementById('restoreBtn').onclick = () => restoreSheet();
  });
}
function restoreSheet(){
  sheet(`<h2>Restore from a code</h2>
    <p>Paste a backup code. This replaces the words currently on this device.</p>
    <textarea id="inBox" rows="4" placeholder="SHEMOS1-..."
      style="font-family:ui-monospace,Menlo,monospace;font-size:.72rem;width:100%;
             padding:.7rem;border-radius:11px;border:1px solid var(--line);
             background:var(--paper);color:var(--ink);resize:vertical"></textarea>
    <div id="restoreMsg" style="font-size:.85rem;color:var(--miss);min-height:1.1rem"></div>
    <button class="btn btn-primary" id="doRestore">Restore</button>
    <button class="btn-ghost" id="closeS">Cancel</button>`, () => {
    document.getElementById('closeS').onclick = () => { closeSheet(); render(); };
    document.getElementById('doRestore').onclick = () => {
      const msg = document.getElementById('restoreMsg');
      let learners;
      try{
        learners = applyCode(document.getElementById('inBox').value);
      }catch(e){
        msg.textContent = 'That code isn&#x2019;t readable. Check it copied in full &#x2014; it should start with SHEMOS1-.';
        return;
      }
      const rec = learners[OWNER] || learners[Object.keys(learners)[0]];
      rec.name = OWNER;
      db.learners = {[OWNER]: rec};
      me = OWNER; db.last = OWNER; save(); closeSheet(); S = null; render();
    };
  });
}

/* ---------------- read ---------------- */
function viewRead(){
  const vs = currentVerses(), a = PAR[pIdx].aliyot[aIdx];
  return `
  <div class="pickrow" id="seferRow">
    ${SEFARIM.map(x=>`<button class="chip" data-c="${esc(x.code)}"
      aria-pressed="${x.code===SEFER}">${esc(x.name)}</button>`).join('')}
  </div>
  <div class="pickrow" id="parRow">
    ${PAR.map((p,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===pIdx}">${esc(p.parsha)}</button>`).join('')}
  </div>
  <div class="aliyot" id="aliRow">
    ${PAR[pIdx].aliyot.map((_,i)=>`<button data-i="${i}" aria-pressed="${i===aIdx}">${i+1}</button>`).join('')}
  </div>
  <div class="readhint">Aliyah ${aIdx+1} &middot; ${a[0]}:${a[1]}&ndash;${a[2]}:${a[3]}. Tap any word you don&#x2019;t know to see what it means and add it to your list.</div>
  <div class="text" id="text">
    ${vs.map(v=>`<div class="pas">${v.w.map((w,j)=>{
        const cls = w[1]>=0 && deckHas(LEX[w[1]][3]) ? ' picked' : '';
        return (j===0?`<span class="vn">${v.c}:${v.v}</span>`:'') +
          `<span class="tw${cls}" data-c="${v.c}" data-v="${v.v}" data-j="${j}">${esc(w[0])}</span> `;
      }).join('')}</div>`).join('')}
  </div>`;
}
function wireRead(){
  document.getElementById('seferRow').onclick = async e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.c === SEFER) return;
    await useSefer(b.dataset.c);
    L().lastSefer = SEFER; save();
    render();
    document.getElementById('view').scrollIntoView({block:'start'});
  };
  document.getElementById('parRow').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    pIdx = +b.dataset.i; aIdx = 0; render();
    document.getElementById('view').scrollIntoView({block:'start'});
  };
  document.getElementById('aliRow').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    aIdx = +b.dataset.i; render();
  };
  document.getElementById('text').onclick = e => {
    const t = e.target.closest('.tw'); if(!t) return;
    openWord(+t.dataset.c, +t.dataset.v, +t.dataset.j);
  };
}
function openWord(c, v, j){
  const verse = V.find(x => x.c===c && x.v===v), w = verse.w[j];
  const surface = w[0];
  if(w[1] < 0){
    sheet(`<div class="wform">${esc(surface)}</div>
      <p style="text-align:center">This one has no dictionary entry in the text data &#x2014; usually a spelling variant. Nothing to add.</p>
      <button class="btn" id="closeS">Close</button>`,
      () => document.getElementById('closeS').onclick = closeSheet);
    return;
  }
  const [heb, gloss, pos, sid] = LEX[w[1]];
  const suf = w[2] || '';                    /* attached pronoun: &#x05D7;&#x05B9;&#x05EA;&#x05B0;&#x05E0;&#x05D5;&#x05B9; = father-in-law + his */
  const has = deckHas(sid);
  sheet(`
    <div class="wform">${esc(surface)}</div>
    ${heb && heb !== surface ? `<div class="wlemma">${esc(heb)}</div>` : ''}
    <div class="wgloss">${esc(gloss)}${suf
      ? ` <span style="color:var(--ink-faint)">+ ${esc(suf)}</span>` : ''}</div>
    <div class="wmeta">${esc(pos)} &middot; ${esc(seferName(SEFER))} ${c}:${v}</div>
    <button class="btn ${has?'':'btn-primary'}" id="addW">${has
      ? 'Remove from my words' : 'I don&#x2019;t know this &#x2014; add it'}</button>
    <button class="btn-ghost" id="closeS">Close</button>`, () => {
    document.getElementById('closeS').onclick = closeSheet;
    document.getElementById('addW').onclick = () => {
      const i = deckIdx(sid);
      if(i >= 0){
        L().deck.splice(i,1);
        if(L().back > L().deck.length) L().back = L().deck.length;
      } else {
        L().deck.push({s:sid, f:surface, r:c+':'+v, x:suf, k:SEFER});
      }
      save(); closeSheet(); render();
    };
  });
}

/* ---------------- my words ---------------- */
function viewWords(){
  const d = L().deck;
  if(!d.length) return `<div class="empty">No words yet.<br><br>
    Open <b>Read</b>, go through the aliyah, and tap any word you don&#x2019;t know.
    Whatever you tap collects here and becomes what you practice.</div>`;
  return `
  <div class="session-meta"><span>In the order you found them</span><span><b>${d.length}</b></span></div>
  <div class="wlist">
    ${d.map((w0,i)=>{ const w = wd(w0); return `<div class="wrow ${i < L().back ? 'rested':''}">
      <span class="num">${i+1}</span>
      <span><span class="h">${esc(w.h)}</span><span class="g">${esc(w.g)}</span></span>
      <button class="x" data-i="${i}" aria-label="Remove">remove</button></div>`; }).join('')}
  </div>
  ${L().back ? `<div class="readhint" style="padding-top:.8rem">The shaded words are resting &#x2014; you had them solid, so they only come back as a spot-check.</div>` : ''}`;
}
function wireWords(){
  document.querySelectorAll('.wrow .x').forEach(b => b.onclick = () => {
    L().deck.splice(+b.dataset.i, 1);
    if(L().back > L().deck.length) L().back = L().deck.length;
    save(); render();
  });
}

/* ---------------- practice ---------------- */
function activeDeck(){ const s=L(); return s.deck.map((w,i)=>i).filter(i => i >= s.back); }
function restedDeck(){ const s=L(); return s.deck.map((w,i)=>i).filter(i => i < s.back); }

function viewPractice(){
  if(S && S.mode==='run')  return runCard();
  if(S && S.mode==='done') return runSummary();
  const act = activeDeck(), last = L().sessions[L().sessions.length-1];
  if(!L().deck.length) return `<div class="empty">Nothing to practice yet.<br><br>
    Tap words you don&#x2019;t know while reading, and they&#x2019;ll show up here.</div>`;
  return `
  <div class="session-meta"><span>Today&#x2019;s review</span>
    <span><b>${act.length}</b> word${act.length===1?'':'s'}</span></div>
  <div class="card pad stack">
    <div>
      <div class="eyebrow">Your words</div>
      <div class="big"><span class="n">${act.length ? act[0]+1 : '&#x2013;'}</span>
        <span class="of">through</span>
        <span class="n">${act.length ? act[act.length-1]+1 : '&#x2013;'}</span></div>
      <div style="font-size:.87rem;color:var(--ink-soft);line-height:1.5">
        Start at the beginning and go straight through, in the order you found them.
        ${L().back ? `<br>The first ${L().back} are resting.` : ''}</div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:.42rem">Which way today?</div>
      <div class="seg" id="dirSeg">
        <button data-d="he" aria-pressed="true">Hebrew &rarr; English</button>
        <button data-d="en" aria-pressed="false">English &rarr; Hebrew</button>
        <button data-d="mix" aria-pressed="false">Mixed</button></div>
    </div>
    <button class="btn btn-primary" id="startBtn" ${act.length?'':'disabled'}>Start review</button>
    ${last?`<div style="font-family:var(--ui);font-size:.73rem;color:var(--ink-faint);text-align:center">
      Last time: ${last.right} of ${last.total} &middot; ${fmtTime(last.ms)}</div>`:''}
  </div>
  <div class="card pad" style="margin-top:.9rem">
    <div class="kv"><span>Session length target</span>
      <span class="stepper"><button id="tMinus" aria-label="Shorter">&minus;</button>
        <b>${L().targetMin} min</b><button id="tPlus" aria-label="Longer">+</button></span></div>
    <div class="kv"><span>Resting</span><b>${restedDeck().length}</b></div>
    <div class="kv"><span>Collected in all</span><b>${L().deck.length}</b></div>
  </div>`;
}
function wirePractice(){
  const seg = document.getElementById('dirSeg');
  if(seg) seg.onclick = e => { const b=e.target.closest('button'); if(!b) return;
    [...seg.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b))); };
  const s = document.getElementById('startBtn');
  if(s) s.onclick = () => startRun(seg.querySelector('[aria-pressed="true"]').dataset.d);
  const f=document.getElementById('faceBtn'); if(f) f.onclick=()=>{S.shown=true;render();};
  const g=document.getElementById('gotBtn');  if(g) g.onclick=()=>grade(true);
  const m=document.getElementById('missBtn'); if(m) m.onclick=()=>grade(false);
  const k=document.getElementById('knowBtn'); if(k) k.onclick=()=>dropCurrent();
  const b=document.getElementById('againBtn');if(b) b.onclick=()=>{S=null;render();};
  const r=document.getElementById('retireBtn');if(r) r.onclick=()=>doRetire();
  const tm=document.getElementById('tMinus'); if(tm) tm.onclick=()=>{
    L().targetMin=Math.max(2,L().targetMin-1);save();render();};
  const tp=document.getElementById('tPlus');  if(tp) tp.onclick=()=>{
    L().targetMin=Math.min(20,L().targetMin+1);save();render();};
}
function startRun(dir){
  const q = activeDeck().map(i=>({i,spot:false}));
  const rest = restedDeck();
  if(rest.length){
    rest.sort((a,b)=>(L().stats[a]?.last||0)-(L().stats[b]?.last||0));
    q.push({i:rest[0], spot:true});
  }
  S = {mode:'run', dir, q, k:0, shown:false, right:0, wrong:[], t0:Date.now()};
  render();
}
function curDir(){ return S.dir!=='mix' ? S.dir : (S.q[S.k].i % 2 ? 'he' : 'en'); }
function runCard(){
  const {i,spot} = S.q[S.k], w = wd(L().deck[i]), d = curDir();
  return `
  <div class="session-meta">
    <span>${spot?'<span class="spot">Spot-check</span>':'Word '+(i+1)}</span>
    <span><b>${S.k+1}</b> / ${S.q.length}</span></div>
  <div class="card">
    <div class="face" id="faceBtn" role="button" tabindex="0">
      ${d==='he'?`<div class="p-he">${esc(w.h)}</div>`:`<div class="p-en">${esc(w.g)}</div>`}
      ${S.shown?'':'<div class="tap">Tap to see the answer</div>'}
    </div>
    ${S.shown?`<div class="answer">
      ${d==='he'?`<div class="a-en">${esc(w.g)}</div>`:`<div class="a-he">${esc(w.h)}</div>`}
      ${w.f && w.f!==w.h ? `<div class="a-form">${esc(w.f)}${w.x
        ? ` <span style="font-family:var(--en);font-size:.8rem;color:var(--ink-faint)">+ ${esc(w.x)}</span>` : ''}</div>` : ''}
      <div class="a-ref">${esc(w.p)} &middot; ${esc(seferName(w.k || 'exod'))} ${esc(w.r)}</div>
      <div class="grade">
        <button class="g-miss" id="missBtn">Missed it</button>
        <button class="g-good" id="gotBtn">Got it</button></div>
      <button class="btn-ghost" id="knowBtn">I know this now &#x2014; take it off my list</button>
    </div>`:''}
  </div>`;
}
function grade(ok){
  const {i} = S.q[S.k], key = L().deck[i].s;
  const st = L().stats[key] || {seen:0,right:0,streak:0,last:0};
  st.seen++; st.last = Date.now();
  if(ok){ st.right++; st.streak++; S.right++; } else { st.streak=0; S.wrong.push(i); }
  L().stats[key] = st; save();
  S.k++; S.shown = false;
  if(S.k >= S.q.length) finish();
  render();
}
function finish(){
  S.mode='done'; S.ms = Date.now()-S.t0;
  L().sessions.push({t:Date.now(), total:S.q.length, right:S.right, ms:S.ms});
  save();
}
function dropCurrent(){
  const {i} = S.q[S.k];
  L().deck.splice(i,1);
  if(L().back > L().deck.length) L().back = L().deck.length;
  save();
  S.q = S.q.filter(x => x.i !== i).map(x => ({...x, i: x.i > i ? x.i-1 : x.i}));
  if(S.k >= S.q.length) finish(); else S.shown = false;
  render();
}
function runSummary(){
  const clean = S.wrong.length===0, over = S.ms > L().targetMin*60000;
  const act = activeDeck();
  const drop = act.slice(0, Math.min(2, Math.max(0, act.length-1)));
  return `
  <div class="session-meta"><span>Done for today</span><span><b>${fmtTime(S.ms)}</b></span></div>
  <div class="card pad stack">
    <div><div class="big"><span class="n">${S.right}</span>
      <span class="of">of ${S.q.length} right</span></div>
      ${clean?'<div style="font-size:.9rem;color:var(--good)">Clean run &#x2014; every word.</div>'
        :`<div style="font-size:.88rem;color:var(--ink-soft);line-height:1.55">Come back to
          ${S.wrong.map(i=>`<span class="he">${esc(wd(L().deck[i]).h)}</span>`).join(', ')} tomorrow.</div>`}</div>
    ${over && drop.length ? `<div style="border-top:1px solid var(--line-soft);padding-top:.85rem">
      <div style="font-size:.88rem;color:var(--ink-soft);line-height:1.55">
        That took ${fmtTime(S.ms)}, past your ${L().targetMin}-minute mark. Rest
        ${drop.map(i=>`<span class="he">${esc(wd(L().deck[i]).h)}</span>`).join(' and ')}?
        ${drop.length===1?'It':'They'} will still come back now and then as a spot-check.</div>
      <div style="margin-top:.7rem"><button class="btn" id="retireBtn">Rest
        ${drop.length===1?'it':'them'}</button></div></div>`:''}
    <button class="btn-ghost" id="againBtn">Back</button>
  </div>`;
}
function doRetire(){
  const act = activeDeck();
  const n = Math.min(2, Math.max(0, act.length-1));
  if(n>0) L().back = act[n-1]+1;
  save(); S=null; render();
}

/* ---------------- sheet ---------------- */
function sheet(html, wire){
  document.getElementById('sheet').innerHTML =
    `<div class="sheet"><div class="inner">${html}</div></div>`;
  if(wire) wire();
}
function closeSheet(){ document.getElementById('sheet').innerHTML=''; }

document.addEventListener('keydown', e => {
  if(!S || S.mode!=='run') return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!S.shown){S.shown=true;render();} }
  else if(S.shown && (e.key==='ArrowRight'||e.key==='y')) grade(true);
  else if(S.shown && (e.key==='ArrowLeft' ||e.key==='n')) grade(false);
});

/* The page is wrapped in a <head> this file does not control. Without a viewport tag iOS
   lays out at ~980px and scales down, which makes the text small and the taps imprecise.
   Add one only if the wrapper did not already supply it. */
if(!document.querySelector('meta[name="viewport"]')){
  const m = document.createElement('meta');
  m.name = 'viewport';
  m.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
  document.head.appendChild(m);
}

me = OWNER;
(async () => {
  await loadLex();
  await useSefer((L() && L().lastSefer) || SEFER);
  render();
  if(me && !L().seenIntro && !L().deck.length) introSheet();
})();
</script>
